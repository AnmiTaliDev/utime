name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [created]

jobs:
  # Linux builds with cross-compilation
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch:
          - { target: x86_64, meson_cpu: x86_64, cc: gcc }
          - { target: x86, meson_cpu: x86, cc: gcc, flags: "-m32" }
          - { target: aarch64, meson_cpu: aarch64, cc: aarch64-linux-gnu-gcc }
          - { target: armv7, meson_cpu: arm, cc: arm-linux-gnueabihf-gcc }
          - { target: riscv64, meson_cpu: riscv64, cc: riscv64-linux-gnu-gcc }
    name: Linux ${{ matrix.arch.target }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build

      - name: Install cross-compilation tools
        if: matrix.arch.target != 'x86_64'
        run: |
          if [ "${{ matrix.arch.target }}" = "x86" ]; then
            sudo apt-get install -y gcc-multilib g++-multilib
          elif [ "${{ matrix.arch.target }}" = "aarch64" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          elif [ "${{ matrix.arch.target }}" = "armv7" ]; then
            sudo apt-get install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf
          elif [ "${{ matrix.arch.target }}" = "riscv64" ]; then
            sudo apt-get install -y gcc-riscv64-linux-gnu g++-riscv64-linux-gnu
          fi

      - name: Create cross file
        if: matrix.arch.target != 'x86_64'
        run: |
          cat > cross-${{ matrix.arch.target }}.ini << EOF
          [binaries]
          c = '${{ matrix.arch.cc }}'
          strip = '$(echo ${{ matrix.arch.cc }} | sed 's/gcc$/strip/')'

          [host_machine]
          system = 'linux'
          cpu_family = '${{ matrix.arch.meson_cpu }}'
          cpu = '${{ matrix.arch.meson_cpu }}'
          endian = 'little'
          EOF

      - name: Setup build (native)
        if: matrix.arch.target == 'x86_64'
        run: meson setup build --buildtype=release

      - name: Setup build (cross)
        if: matrix.arch.target != 'x86_64'
        run: |
          if [ "${{ matrix.arch.target }}" = "x86" ]; then
            CFLAGS="-m32" meson setup build --buildtype=release
          else
            meson setup build --cross-file=cross-${{ matrix.arch.target }}.ini --buildtype=release
          fi

      - name: Build
        run: meson compile -C build

      - name: Run tests (native only)
        if: matrix.arch.target == 'x86_64'
        run: meson test -C build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: utime-linux-${{ matrix.arch.target }}
          path: build/utime

  # macOS builds
  build-macos:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-13
            arch: x86_64
          - os: macos-14
            arch: aarch64
    name: macOS ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install meson ninja

      - name: Setup build
        run: meson setup build --buildtype=release

      - name: Build
        run: meson compile -C build

      - name: Run tests
        run: meson test -C build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: utime-macos-${{ matrix.arch }}
          path: build/utime

  # FreeBSD builds
  build-freebsd:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x86_64, aarch64]
    name: FreeBSD ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4

      - name: Build in FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg install -y meson ninja
          run: |
            meson setup build --buildtype=release
            meson compile -C build
            meson test -C build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: utime-freebsd-${{ matrix.arch }}
          path: build/utime

  # OpenBSD builds
  build-openbsd:
    runs-on: ubuntu-latest
    name: OpenBSD x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Build in OpenBSD VM
        uses: vmactions/openbsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg_add meson ninja
          run: |
            meson setup build --buildtype=release
            meson compile -C build
            meson test -C build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: utime-openbsd-x86_64
          path: build/utime

  # NetBSD builds
  build-netbsd:
    runs-on: ubuntu-latest
    name: NetBSD x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Build in NetBSD VM
        uses: vmactions/netbsd-vm@v1
        with:
          usesh: true
          prepare: |
            /usr/sbin/pkg_add meson ninja-build
          run: |
            meson setup build --buildtype=release
            meson compile -C build
            meson test -C build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: utime-netbsd-x86_64
          path: build/utime

  # Windows builds (MinGW cross-compilation)
  build-windows:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch:
          - { target: x86_64, mingw: x86_64-w64-mingw32 }
          - { target: x86, mingw: i686-w64-mingw32 }
    name: Windows ${{ matrix.arch.target }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build mingw-w64

      - name: Create cross file
        run: |
          cat > cross-windows-${{ matrix.arch.target }}.ini << EOF
          [binaries]
          c = '${{ matrix.arch.mingw }}-gcc'
          strip = '${{ matrix.arch.mingw }}-strip'

          [host_machine]
          system = 'windows'
          cpu_family = '${{ matrix.arch.target }}'
          cpu = '${{ matrix.arch.target }}'
          endian = 'little'
          EOF

      - name: Setup build
        run: meson setup build --cross-file=cross-windows-${{ matrix.arch.target }}.ini --buildtype=release

      - name: Build
        run: meson compile -C build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: utime-windows-${{ matrix.arch.target }}
          path: build/utime.exe

  # Create release with all artifacts
  release:
    if: github.event_name == 'release'
    needs:
      [
        build-linux,
        build-macos,
        build-freebsd,
        build-openbsd,
        build-netbsd,
        build-windows,
      ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create archives
        run: |
          cd artifacts
          for dir in */; do
            name="${dir%/}"
            if [[ $name == *"windows"* ]]; then
              zip -j "${name}.zip" "$dir"/*
            else
              tar czf "${name}.tar.gz" -C "$dir" .
            fi
          done

      - name: Upload release assets
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/*.{tar.gz,zip}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
